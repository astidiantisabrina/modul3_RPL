name: Python CI Pipeline - Sistem Perpustakaan

# Pipeline berjalan otomatis saat ada push atau pull request ke branch main,
# dan juga bisa dijalankan manual dari tab Actions (workflow_dispatch)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Hak akses minimum: workflow hanya perlu membaca isi repositori
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 1. Mengambil Kode dari Repositori (Checkout)
      uses: actions/checkout@v4

    - name: 2. Menyiapkan Lingkungan Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: 3. Menginstal Dependensi Proyek
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Pengecekan kualitas kode: mencari kesalahan sintaks dan nama yang
    # tidak terdefinisi (E9, F63, F7, F82). Dijalankan sebelum pytest.
    - name: 4. Pengecekan Kualitas Kode (Flake8)
      run: |
        flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Menjalankan Automated Unit Testing (Pytest)
      env:
        PYTHONPATH: .
      # Server GitHub tidak punya database MySQL maupun layar, jadi hanya
      # tes yang memakai mock (tanpa koneksi asli) yang dijalankan di sini.
      # Untuk menjalankan semua tes: ganti dengan "python -m pytest -v"
      run: |
        python -m pytest test_auth.py -v