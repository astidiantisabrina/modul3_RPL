
name: Python CI Pipeline - Sistem Perpustakaan

# Pipeline berjalan otomatis saat ada push atau pull request ke branch main
# dan dapat dijalankan manual melalui tab Actions.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Hak akses minimum
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Mengambil kode dari repositori
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Python 3.11
      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Menginstal dependensi proyek
      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 4. Memeriksa kualitas kode menggunakan Flake8
      - name: 4. Pengecekan Kualitas Kode (Flake8)
        run: |
          flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

      # 5. Menjalankan pengujian otomatis menggunakan Pytest
      - name: 5. Automated Unit Testing (Pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest test_auth.py -v
